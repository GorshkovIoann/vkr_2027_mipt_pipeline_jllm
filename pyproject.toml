[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbs-comparison"
version = "0.1.0"
description = "Offline AB/BA comparison graph in Dagster"
requires-python = ">=3.10"
dependencies = ["dagster==1.13.29"]

[project.optional-dependencies]
ui = ["dagster-webserver==1.13.29"]

[tool.setuptools.packages.find]
include = ["sbs_comparison*"]

[tool.dagster]
module_name = "sbs_comparison.definitions"
